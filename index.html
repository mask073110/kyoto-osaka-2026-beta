<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5efe5"><title>京都・大阪 秋旅｜2026 BETA</title>
<style>
:root{--paper:#f6f0e6;--card:#fffaf1;--ink:#302a25;--muted:#8e8175;--line:#dfd3c3;--red:#a64c3c;--soft:#efe5d8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e5e3df;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;background:var(--paper);padding-bottom:76px}.hero{height:285px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;position:relative;background-position:center;background-size:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.72),rgba(0,0,0,.08) 65%)}.hero>*{z-index:1}.top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:11px;font-weight:700}.beta{border:1px solid #ffffff99;border-radius:18px;padding:4px 9px}.eyebrow{font:9px Georgia,serif;letter-spacing:.17em}.hero h1{font:27px/1.2 Georgia,"Noto Serif TC",serif;margin:7px 0}.hero p{font-size:11px;margin:0}.meta{padding:17px 18px 10px}.meta-row{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.motto{font:15px Georgia,"Noto Serif TC",serif;margin:14px 0}.days{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);padding-top:8px}.days button{border:0;background:transparent;color:#766c63;padding:8px 1px;border-radius:3px}.days button.active{background:var(--red);color:white}.days b,.days span{display:block}.days span{font-size:8px;margin-top:3px}.content{padding:6px 18px 24px}.section-kicker{font:8px Georgia,serif;letter-spacing:.17em;color:#a68f79}.section-title{font:23px Georgia,"Noto Serif TC",serif;margin:5px 0 8px}.note{display:flex;justify-content:space-between;gap:8px;font-size:9px;color:#94877a;margin-bottom:10px}.timeline,.panel,.poi{border:1px solid var(--line);background:var(--card);border-radius:12px}.timeline{padding:4px 13px}.event{display:grid;grid-template-columns:27px 48px 1fr;align-items:center;min-height:49px;border-bottom:1px solid #e9dfd3;font-size:11px}.event:last-child{border:0}.num{font:9px Georgia;color:#b59a7f}.time{font:10px Georgia;color:#71675f}.action{margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}.action h3{font:18px Georgia,"Noto Serif TC",serif;margin:4px 0}.action p,.sub{font-size:10px;color:#81766c;line-height:1.55}.buttons{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.btn{border:1px solid #d9ccbb;background:#fffaf1;border-radius:8px;padding:9px 10px;font-size:10px;color:var(--ink)}.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}.status{margin-top:9px;padding:9px;border-radius:8px;background:#efe7db;font-size:10px;line-height:1.45}.panel{padding:13px;margin:10px 0}.panel h3,.poi h3{font:16px Georgia,"Noto Serif TC",serif;margin:0 0 5px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.chip{font-size:9px;padding:4px 7px;border-radius:20px;background:#eee3d6;color:#715f51}.poi{padding:12px;margin:9px 0}.poi-head{display:flex;justify-content:space-between;gap:8px}.badge{font-size:9px;color:#54715a}.price{font:11px Georgia}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:64px;background:#fffaf6f5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:transparent;color:#766d64;font-size:10px}.nav button.active{color:var(--red)}.nav i{font-style:normal;display:block;font-size:17px;margin-bottom:2px}.utility{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.utility .panel{margin:0}.empty{padding:28px 0;text-align:center;color:var(--muted);font-size:11px}@media(min-width:431px){body{padding:16px 0}.app{border-radius:14px;overflow:hidden;box-shadow:0 5px 30px #00000012}.nav{bottom:16px}}
</style></head><body><div id="app" class="app"></div>
<script>
const DAYS=[
{date:"11/19",title:"台灣 → 關西 → 京都",sub:"出發・抵達京都・晚上自由活動",img:"https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1000&q=85",events:[["03:40","NOAH 新竹市出發"],["04:00","1250 客運 → 桃園機場 T1"],["05:00","T1 全員集合"],["07:40","JX820 → KIX"],["11:10","抵達 KIX"],["12:30","包車 → 京都飯店"],["15:00","飯店寄放／入住・休息"],["16:00","OPTION｜寺町・新京極・四条河原町"],["18:30","沿途晚餐"]],photo:["京都抵達紀錄","寺町・新京極街拍","四条河原町夜景"],food:["かつくら寺町店","河原町沿線晚餐候選"],near:["3COINS 京都寺町店","LE LABO Kyoto Machiya","寺町・新京極商店街"]},
{date:"11/20",title:"和服・清水寺・祇園",sub:"主要人像攝影日",img:"https://images.unsplash.com/photo-1528360983277-13d401cdc186?auto=format&fit=crop&w=1000&q=85",events:[["09:00","和服店｜3位女生著裝・髮型"],["10:00","清水寺"],["11:15","三年坂・二年坂"],["12:30","沿途午餐"],["14:00","八坂塔・高台寺方向"],["16:00","祇園・花見小路"],["17:15","歸還和服 → 河原町晚餐"]],photo:["清水寺｜和服人像","二年坂・三年坂｜街景","八坂塔｜壓縮構圖","祇園・花見小路｜黃昏"],food:["% ARABICA Higashiyama","GOKAGO","本家西尾八橋 清水店","天ぷら圓堂 八坂本店"],near:["Koto no Iroha 祇園店","AKANES 清水周邊"]},
{date:"11/21",title:"弘法市・糺之森・伏見稻荷",sub:"包車固定行程",img:"https://images.unsplash.com/photo-1478436127897-769e1b3f0f36?auto=format&fit=crop&w=1000&q=85",events:[["08:30","京都飯店出發"],["09:00","東寺 弘法市"],["11:30","下鴨神社・糺之森"],["14:30","移動伏見稻荷"],["15:00","伏見稻荷大社"],["17:30","京都站晚餐"]],photo:["東寺弘法市｜紀實","糺之森｜林間人像","伏見稻荷｜千本鳥居"],food:["ROOT2 SEIKA TOJI","出町ろろろ","祢ざめ家"],near:["弘法市攤位","伏見稻荷參道"]},
{date:"11/22",title:"勝尾寺・箕面・大阪",sub:"退房＋包車移動日",img:"https://images.unsplash.com/photo-1590559899731-a382839e5549?auto=format&fit=crop&w=1000&q=85",events:[["08:00","京都飯店退房｜行李上車"],["09:30","勝尾寺"],["11:30","箕面公園・瀑布"],["13:30","橋本亭・柚子咖啡"],["14:45","杯麵博物館 池田"],["17:00","大阪飯店入住"]],photo:["勝尾寺｜達摩與紅葉","箕面瀑布｜秋景"],food:["橋本亭・柚子咖啡","大阪飯店周邊晚餐"],near:["杯麵博物館紀念品","大阪飯店周邊採買"]},
{date:"11/23",title:"新世界 → 道頓堀 → 心齋橋",sub:"大阪街拍・美食・採買",img:"https://images.unsplash.com/photo-1590253230532-a67f6bc61c9e?auto=format&fit=crop&w=1000&q=85",events:[["09:00","大阪飯店出發"],["09:30","新世界・通天閣"],["12:00","日本橋"],["13:00","難波・千日前"],["15:00","道頓堀"],["17:00","心齋橋・長堀橋"],["18:30","大阪晚餐"]],photo:["新世界｜復古街拍","道頓堀｜藍調時刻","心齋橋｜夜間人像"],food:["串かつてんぐ","りくろーおじさん","551 HORAI"],near:["TAPTAP Lab","HISEKI","日本橋動漫・扭蛋"]},
{date:"11/24",title:"大阪 → KIX → 台灣",sub:"回程・退稅・最後採買",img:"https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=1000&q=85",events:[["08:00","飯店早餐／最後整理"],["09:30","退房・8 人行李集合"],["10:00","包車 → KIX"],["11:00","KIX｜報到・退稅／海關・最後採買"],["14:00","JX823 → TPE"],["16:15","抵達 TPE"]],photo:["回程紀錄"],food:["KIX 出境前／後餐飲"],near:["KIX 最後採買・伴手禮"]}
];
let day=Number(localStorage.getItem("kyotoDay")||0),tab=localStorage.getItem("kyotoTab")||"today",locationText="尚未定位";
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function hero(d){return '<header class="hero" style="background-image:url('+d.img+')"><div class="top"><b>京都・大阪 秋旅</b><span class="beta">2026 BETA</span></div><div class="eyebrow">DAY '+(day+1)+' · '+d.date+'</div><h1>'+esc(d.title)+'</h1><p>'+esc(d.sub)+'</p></header>'}
function daybar(){return '<section class="meta"><div class="meta-row"><span>2026.11.19 — 11.24</span><b>8人攝影旅行</b></div><div class="motto">攝影決定路線，美食提供選擇。</div><div class="days">'+DAYS.map((d,i)=>'<button class="'+(i===day?'active':'')+'" onclick="setDay('+i+')"><b>'+(i+1)+'</b><span>'+d.date+'</span></button>').join("")+'</div></section>'}
function today(d){return '<main class="content"><div class="section-kicker">TODAY\'S ROUTE</div><h2 class="section-title">今日行程</h2><div class="note"><span>小提醒｜依現場節奏彈性調整</span><span>● '+d.events.length+' 行程</span></div><div class="timeline">'+d.events.map((e,i)=>'<div class="event"><span class="num">'+String(i+1).padStart(2,"0")+'</span><span class="time">'+e[0]+'</span><span>'+esc(e[1])+'</span></div>').join("")+'</div><section class="action"><div class="section-kicker">RIGHT NOW</div><h3>現在去哪？</h3><p>依目前時間、位置與今日剩餘行程重新判斷；即時資料未取得時不顯示假 ETA。</p><div class="buttons"><button class="btn primary" onclick="locate()">📍 重新定位</button><button class="btn" onclick="hotel()">🏨 回飯店</button><button class="btn" onclick="rest()">☕ 附近休息</button></div><div class="status" id="locStatus">目前位置：'+esc(locationText)+'</div></section><div class="utility"><div class="panel"><div class="section-kicker">GROUP</div><h3>集合模式</h3><div class="sub">集合地點、時間與 8 人到齊狀態。</div></div><div class="panel"><div class="section-kicker">TRIP</div><h3>旅費</h3><div class="sub">共同帳本・誰欠誰・結清。</div></div><div class="panel"><div class="section-kicker">PLAN</div><h3>A / B / C</h3><div class="sub">正常・雨天・疲累縮短。</div></div><div class="panel"><div class="section-kicker">PREP</div><h3>出發準備</h3><div class="sub">VJW・報到・eSIM・行李。</div></div></div></main>'}
function cards(title,kicker,arr,type){return '<main class="content"><div class="section-kicker">'+kicker+'</div><h2 class="section-title">'+title+'</h2><div class="note"><span>DAY '+(day+1)+' · '+DAYS[day].date+'</span><span>目前資料｜出發前再確認</span></div>'+arr.map((x,i)=>'<article class="poi"><div class="poi-head"><h3>'+esc(x)+'</h3><span class="badge">'+(type==="photo"?"📸 路線攝影":type==="food"?"🟢 順路候選":"📍 路線周邊")+'</span></div><div class="chips">'+(type==="photo"?'<span class="chip">推薦時段依當日路線</span><span class="chip">R8 / 45mm</span>':type==="food"?'<span class="chip">8人適性待確認</span><span class="chip">營業/LO待確認</span>':'<span class="chip">可逛可不逛</span><span class="chip">不打亂主線</span>')+'</div><div class="sub">'+(type==="photo"?"以拍攝效果為主，但不為理想光線大幅改道。":type==="food"?"價格、營業時間、LO 與 8 人座位將以出發前最新資料確認。":"依目前位置顯示距離與 ETA；不為單一店家跨區。")+'</div><div class="buttons"><button class="btn" onclick="searchMap(\''+esc(x).replace(/&#39;/g,"\\'")+'\')">導航</button>'+(type==="food"?'<button class="btn">♡ 想吃 +1</button>':type==="near"?'<button class="btn">♡ 想逛 +1</button>':'')+'</div></article>').join("")+'</main>'}
function nav(){return '<nav class="nav">'+[["today","⌾","今日"],["photo","▣","攝影"],["food","♜","美食"],["near","▤","周邊"]].map(x=>'<button class="'+(tab===x[0]?'active':'')+'" onclick="setTab(\''+x[0]+'\')"><i>'+x[1]+'</i>'+x[2]+'</button>').join("")+'</nav>'}
function render(){let d=DAYS[day],body=tab==="today"?today(d):tab==="photo"?cards("攝影指南","PHOTO ROUTE",d.photo,"photo"):tab==="food"?cards("沿途美食","FOOD OPTIONS",d.food,"food"):cards("路線周邊","NEARBY",d.near,"near");document.getElementById("app").innerHTML=hero(d)+daybar()+body+nav()}
function setDay(i){day=i;localStorage.setItem("kyotoDay",i);render();scrollTo({top:0,behavior:"smooth"})}function setTab(t){tab=t;localStorage.setItem("kyotoTab",t);render();scrollTo({top:0,behavior:"smooth"})}
function locate(){let s=document.getElementById("locStatus");if(!navigator.geolocation){locationText="此瀏覽器不支援定位";render();return}s.textContent="正在取得位置…";navigator.geolocation.getCurrentPosition(p=>{locationText="定位成功｜"+p.coords.latitude.toFixed(4)+", "+p.coords.longitude.toFixed(4);render()},()=>{locationText="定位未授權／取得失敗，可稍後重新定位";render()},{enableHighAccuracy:true,timeout:10000,maximumAge:0})}
function hotel(){let q=day<3?"Comfort Hotel Kyoto Horikawagojo":"Hearton Hotel Shinsaibashi Nagahoridori";window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),"_blank")}
function rest(){window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("cafe convenience store toilet"),"_blank")}
function searchMap(q){window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),"_blank")}
render();
</script></body></html>
