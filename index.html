function openCandidate(){sheet("＋新增想去",'<p class="sub">目前先確保資料正確：可貼能直接辨識店名的 Google Maps 網址；其他短網址／官網網址會等共用後台完成後再開放自動解析，不會先建立空白卡。</p><input id="candLink" class="field" inputmode="url" autocomplete="url" placeholder="貼上 Google Maps／店家網址"><input id="candName" class="field" placeholder="店名（網址無法直接辨識時可手動填寫）"><select id="candType" class="field"><option value="food">🍴 美食</option><option value="spot">📍 景點</option><option value="shop">🛍️ 購物</option><option value="rest">☕ 休息</option><option value="drug">💊 藥妝</option><option value="gift">🎁 伴手禮</option></select><select id="candUser" class="field">'+MEMBERS.map(n=>'<option>'+n+'</option>').join("")+'</select><button class="btn primary" onclick="addCandidate()">確認加入</button><div class="candidate">'+candidateList()+'</div>')}
function addCandidate(){let n=document.getElementById("candName").value.trim(),l=document.getElementById("candLink").value.trim(),t=document.getElementById("candType").value,u=document.getElementById("candUser").value;if(!l&&!n)return alert("請貼上網址，或輸入店名");if(l&&!validCandidateUrl(l))return alert("網址格式不正確，請重新貼上完整網址");if(l&&!n&&candidateNeedsBackend(l))return alert("這個網址需要後台解析才能確認店家資料。為避免建立錯誤空卡，目前不會加入；可先補店名，或等共用後台完成後直接貼網址。");n=candidateDisplayName(n,l);if(!n)return alert("目前無法辨識店名，資料未建立");let suggested=day,reason=l?"已保留來源網址；完整店家資料將於共用後台啟用後解析。":"先加入目前 DAY 候選池，尚未綁定行程站點。";candidates.push({id:Date.now(),name:n,link:l,type:t,day:suggested,user:u,votes:1,source:l?"url":"manual",parseStatus:l?"url-name":"manual",reason:reason});localStorage.setItem("tripCandidates",JSON.stringify(candidates));closeSheet();setTimeout(()=>openCandidate(),30)}
function candidateList(){let a=candidates.filter(x=>x.day===day);if(!a.length)return '<div class="empty">本日尚無團員候選</div>';return a.map(x=>'<div class="candidate-row"><span><b>'+esc(x.name)+'</b><br><span class="small">DAY '+(x.day+1)+(x.station?'｜'+esc(x.station):'｜未綁定站點')+' · '+esc(x.user||"團員")+'</span><div class="routefit">🟡 '+esc(x.reason||"路線適性待確認")+'</div><div class="candidate-actions"><button onclick="'+(x.link?'window.open(&quot;'+esc(x.link)+'&quot;,&quot;_blank&quot;)':'searchMap(&quot;'+esc(x.name)+'&quot;)')+'">Google Maps</button><button onclick="deleteCandidate('+x.id+',null)">刪除</button></div></span><button class="vote '+(myVotes.includes(x.id)?'voted':'')+'" onclick="voteCandidate('+x.id+')">'+(myVotes.includes(x.id)?'♥':'♡')+' '+(x.votes||0)+'</button></div>').join("")}
function voteCandidate(id){if(myVotes.includes(id))return;let x=candidates.find(x=>x.id===id);if(x){x.votes=(x.votes||0)+1;myVotes.push(id);localStorage.setItem("tripMyVotes",JSON.stringify(myVotes));localStorage.setItem("tripCandidates",JSON.stringify(candidates));let b=document.querySelector('button[onclick="voteCandidate('+id+')"]');if(b){b.classList.add("voted");b.textContent="♥ "+x.votes}}}
function mode(m){planMode=m;localStorage.setItem("planMode",m);render()}
function sheet(title,html){closeSheet();let d=document.createElement("div");d.className="sheet";d.id="sheet";d.innerHTML='<div class="sheetbox"><div class="sheethead"><h2>'+esc(title)+'</h2><button class="close" onclick="closeSheet()">×</button></div>'+html+'</div>';document.body.appendChild(d)}

function openGroup(){let arrived=JSON.parse(localStorage.getItem("arrived")||"[]"),count=GROUP_MEMBERS.reduce((n,m,i)=>n+(arrived.includes(i)?m.count:0),0);sheet("集合模式",'<p class="sub">共 8 人｜亦昀 Yui 與老公合併顯示；勾選該列即代表 2 人到齊。</p><div class="panel">'+GROUP_MEMBERS.map((m,i)=>'<label style="display:block;padding:10px 0;border-bottom:1px solid var(--line)"><input type="checkbox" onchange="setArrived('+i+',this.checked)" '+(arrived.includes(i)?"checked":"")+'> '+m.name+(m.count===2?' <span class="chip">2人</span>':'')+'</label>').join("")+'</div><div class="status">'+count+'/8 已到</div>')}
function setArrived(i,on){let a=JSON.parse(localStorage.getItem("arrived")||"[]");a=on?[...new Set([...a,i])]:a.filter(x=>x!==i);localStorage.setItem("arrived",JSON.stringify(a));let count=GROUP_MEMBERS.reduce((n,m,j)=>n+(a.includes(j)?m.count:0),0),box=document.querySelector("#sheet .status");if(box)box.textContent=count+"/8 已到"}
function prepProgress(){let a=JSON.parse(localStorage.getItem("prep")||"[]"),total=11,pct=Math.round(a.length/total*100);return '<div class="status">出發準備 '+a.length+'/'+total+'<div class="progress"><span style="width:'+pct+'%"></span></div></div>'}
function nav(){return '<nav class="nav">'+[["today","⌾","今日"],["photo","▣","攝影"],["food","♜","美食"],["near","▤","周邊"]].map(x=>'<button class="'+(tab===x[0]?'active':'')+'" onclick="setTab(\''+x[0]+'\')"><i>'+x[1]+'</i>'+x[2]+'</button>').join("")+'</nav>'}
function render(dir){let d=DAYS[day],body=tab==="today"?today(d):tab==="photo"?cards("攝影指南","PHOTO ROUTE",d.photo,"photo"):tab==="food"?cards("沿途美食","FOOD OPTIONS",d.food,"food"):cards("路線周邊","NEARBY",d.near,"near");document.getElementById("app").innerHTML='<div class="page-motion '+(dir==="back"?"back":"")+'">'+hero(d)+daybar()+body+'</div>'+nav()};if(tab==="today")setTimeout(loadWeather,0)
function setDay(i){if(i<0||i>=DAYS.length||i===day)return;day=i;localStorage.setItem("kyotoDay",i);render("fade")}function setTab(t){if(t===tab)return;tab=t;localStorage.setItem("kyotoTab",t);render("fade");scrollTo({top:0,behavior:"auto"})}
function locate(){let el=document.getElementById("locStatus");if(!navigator.geolocation){locationText="此瀏覽器不支援定位";if(el)el.textContent="目前位置："+locationText;return}if(el)el.textContent="目前位置：正在重新定位…";navigator.geolocation.getCurrentPosition(p=>{currentCoords={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};locationText="定位成功｜精度約 "+Math.round(p.coords.accuracy)+"m";let x=document.getElementById("locStatus");if(x)x.textContent="目前位置："+locationText},()=>{currentCoords=null;locationText="定位未授權／取得失敗，可稍後重新定位";let x=document.getElementById("locStatus");if(x)x.textContent="目前位置："+locationText},{enableHighAccuracy:true,timeout:10000,maximumAge:0})}
function etaMap(q){let dest=encodeURIComponent(q),base="https://www.google.com/maps/dir/?api=1&destination="+dest+"&travelmode=transit";if(currentCoords)base+="&origin="+encodeURIComponent(currentCoords.lat+","+currentCoords.lng);window.open(base,"_blank")}
function etaButton(q){return '<button class="btn" onclick="etaMap(&quot;'+esc(q)+'&quot;)">⏱ 到達時間</button>'}
function hotel(){let n=japanNow(),actual=tripDateIndex(n),cur=n.hour*60+n.minute,useKyoto=day<3||(day===3&&actual===3&&cur<8*60),q=useKyoto?"Comfort Hotel Kyoto Horikawagojo":"Hearton Hotel Shinsaibashi Nagahoridori";window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),"_blank")}
function rest(){window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("cafe convenience store toilet"),"_blank")}
function searchMap(q){window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),"_blank")}
function openDetail(title,type){let meta=type==="photo"?PHOTO_META[title]:type==="food"?FOOD_META[title]:NEAR_META[title],extra="";if(meta)extra='<div class="panel"><h3>快速資訊</h3>'+meta.map(x=>'<p class="sub">・'+esc(x)+'</p>').join("")+'</div>';let d=document.createElement("div");d.className="detail";d.id="detail";d.innerHTML='<section class="detailpage"><div class="detailtop"><button class="backbtn" onclick="closeDetail()"><span class="arrow">‹</span><span class="backtext">回上頁</span></button><div><div class="section-kicker">'+type.toUpperCase()+'</div><h2 class="section-title">'+esc(title)+'</h2></div></div>'+extra+'<div class="panel"><h3>DAY '+(day+1)+' 路線判斷</h3><p class="sub">主行程優先。即時距離、營業時間、LO 與 ETA 未取得時維持「待確認」，不產生假資料。</p><div class="buttons"><button class="btn primary" onclick="searchMap(&quot;'+esc(title)+'&quot;)">Google Maps 導航</button>'+etaButton(title)+'</div></div></section>';document.body.appendChild(d);bindDetailSwipe()}
function bindDetailSwipe(){let p=document.querySelector(".detailpage"),x=0,y=0;if(!p)return;p.addEventListener("touchstart",e=>{if(e.target.closest("button,input,select"))return;let t=e.touches[0];x=t.clientX;y=t.clientY},{passive:true});p.addEventListener("touchend",e=>{if(!x)return;let t=e.changedTouches[0],dx=t.clientX-x,dy=t.clientY-y;x=0;if(dx>75&&Math.abs(dx)>Math.abs(dy)*1.35)closeDetail()},{passive:true})}
function closeDetail(){let d=document.querySelector(".detailpage");if(!d)return;d.classList.add("out");setTimeout(()=>document.getElementById("detail")?.remove(),240)}
window.addEventListener("error",function(){let a=document.getElementById("app");if(a&&!a.textContent.trim())a.innerHTML='<main class="fallback"><h1>京都・大阪 秋旅</h1><p>介面暫時無法載入，但行程資料仍在。</p></main>'});
try{render()}catch(e){let a=document.getElementById("app"),msg=(e&&e.name?e.name+": ":"")+(e&&e.message?e.message:String(e));if(a)a.innerHTML='<main class="fallback"><h1>京都・大阪 秋旅</h1><p>互動介面暫時無法載入。</p><div class="errbox"><b>安全模式</b><div style="margin-top:8px;font-weight:700;word-break:break-word">錯誤：'+String(msg).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+'</div></div></main>'}

function mins(t){let a=t.split(":").map(Number);return a[0]*60+a[1]}
function japanNow(){let p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()),v={};p.forEach(x=>v[x.type]=x.value);return {year:+v.year,month:+v.month,date:+v.day,hour:+v.hour,minute:+v.minute}}function tripDateIndex(n){let y=n.year??n.getFullYear(),m=n.month??n.getMonth()+1,dt=n.date??n.getDate();if(y!==2026||m!==11||dt<19||dt>24)return -1;return dt-19}function tripPhase(n){let key=(n.year??n.getFullYear())*10000+(n.month??n.getMonth()+1)*100+(n.date??n.getDate());return key<20261119?"before":key>20261124?"after":"during"}function nowState(d){let n=japanNow(),actual=tripDateIndex(n),phase=tripPhase(n),cur=n.hour*60+n.minute,ev=activeEvents(d),future=null,free=null,status=phase==="before"?"before":phase==="after"?"after":actual<day?"past":actual>day?"future":"today";if(status==="today"){future=ev.find(e=>mins(e[0])>=cur)||null;free=future?mins(future[0])-cur:null}return {future,free,status,actual}}
function nowAdvice(d){let x=nowState(d);if(x.status==="before")return "行程尚未開始｜目前為預覽模式。2026/11/19–11/24 旅行期間才會依當天時間判斷「現在去哪？」。";if(x.status==="after")return "旅程已結束｜目前為回顧模式。行程內容仍可查詢，但不再套用即時行程進度。";if(x.status==="past")return "這是已過日期的行程頁｜目前以行程回顧／查詢方式顯示，不套用現在時間。";if(x.status==="future")return "這是後續日期的行程頁｜目前以預覽方式顯示，不會拿今天的時間誤判行程進度。";if(planMode==="C")return "疲累模式：優先縮短移動，保留固定行程；可直接休息或回飯店。";if(planMode==="B")return "雨天模式：保留固定行程，戶外點視現場天候縮短；優先室內與沿線餐飲。";if(!x.future)return "今日固定行程已接近結束，可從沿線美食、周邊或回飯店擇一。";let f=x.free;return (f>=90?"🟢 時間較充裕":f>=45?"🟡 有一段彈性時間":"🔴 接近下一個固定節點")+"｜下一個："+x.future[0]+" "+x.future[1]+"。"+(locationText==="尚未定位"?" 尚未取得位置，因此不顯示假 ETA。":" 已取得裝置定位，請以 Google Maps 即時 ETA 為準。")}
function freeTime(d){let x=nowState(d);if(x.status!=="today")return x.status==="before"?"旅行期間才會啟用即時倒數":"非當日行程｜不顯示假倒數";return x.free===null?"今天已無下一個固定節點":x.free<=0?"下一個固定節點已到時間":"距下一個固定節點約 "+Math.floor(x.free/60)+" 小時 "+x.free%60+" 分"}
function safeWindow(d){let x=nowState(d);if(x.status!=="today")return "預覽模式｜安全 Buffer 將在旅行當日依實際時間計算。";if(x.free===null)return "今天後段可自由安排；回飯店交通時間仍需自行保留。";let buffer=30,usable=Math.max(0,x.free-buffer);return "安全 Buffer 先保留 "+buffer+" 分鐘｜可運用時間約 "+Math.floor(usable/60)+" 小時 "+usable%60+" 分。實際交通仍以 Maps ETA 為準。"}
</script><div style="display:none" id="architecturePolicy">核心旅行功能不依賴 AI 或 LLM；AI/build credits 為 0 時仍可運作。取消 AI Chat、浮動 AI 按鈕、截圖上傳、OCR、照片相簿、Google Photos、旅程照片上傳與刪除管理。Hero 僅為每日固定目的地視覺；攝影頁僅為拍攝指南。</div></body><!-- pages-republish: 2026-10-04 --><!-- pages-force-publish-day1-v2 --></html>
