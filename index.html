<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>京都・大阪 秋旅 2026</title>
  <style>
    :root {--bg-color:#121212;--card-bg:#1e1e1e;--accent-color:#e53935;--text-main:#fff;--text-sub:#b0b0b0;--border-color:#333}
    body{background-color:var(--bg-color);color:var(--text-main);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;margin:0;padding:16px;line-height:1.5}
    header{border-bottom:1px solid var(--border-color);padding-bottom:16px;margin-bottom:20px}
    h1{margin:0 0 8px;font-size:22px;color:#fff}.subtitle{color:var(--text-sub);font-size:14px;margin:0}
    .day-card{background:var(--card-bg);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 4px 10px rgba(0,0,0,.3)}
    .day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.day-title{font-size:18px;font-weight:bold;margin:0}
    .badge{background:var(--accent-color);color:#fff;padding:2px 8px;border-radius:4px;font-size:12px}.meta-info{font-size:13px;color:var(--text-sub);margin-bottom:12px}
    ul{padding-left:20px;margin:0}li{margin-bottom:8px;font-size:14px}.loading{text-align:center;color:var(--text-sub);padding:40px 0}
  </style>
</head>
<body>
<header id="trip-header"><div class="loading">載入行程資訊中...</div></header>
<main id="days-container"><div class="loading">即時同步資料庫中...</div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCPLGQxr1HJHX4-g-GFU0Fc_nhXuYm6p-Y",authDomain:"kyoto-osaka-2026-d410c.firebaseapp.com",projectId:"kyoto-osaka-2026-d410c",storageBucket:"kyoto-osaka-2026-d410c.firebasestorage.app",messagingSenderId:"570320679345",appId:"1:570320679345:web:f2f306fe647923abf94d90"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
onSnapshot(doc(db,"trips","kyoto_osaka_2026"),snapshot=>{const data=snapshot.data();document.getElementById("trip-header").innerHTML=data?`<h1>${data.title||"京都・大阪 秋旅"}</h1><p class="subtitle">${data.dateRange||"2026.11.19 — 11.24"} ｜ ${data.travelers||8} 人同行 ｜ ${data.theme||"賞楓散策・包車路線"}</p>`:`<h1>京都・大阪 秋旅</h1><p class="subtitle">2026.11.19 — 11.24 ｜ 8 人同行</p>`});
onSnapshot(collection(db,"trips","kyoto_osaka_2026","days"),querySnapshot=>{const container=document.getElementById("days-container");if(querySnapshot.empty){container.innerHTML='<div class="loading">目前資料庫尚無行程，請至 Firestore 寫入資料。</div>';return}let html="";querySnapshot.forEach(d=>{const day=d.data();const spotsHtml=(day.spots||[]).map(s=>`<li><strong>${s.time||""}</strong> ${s.title||""}${s.description?`<br><span style="color:#b0b0b0;font-size:12px;">${s.description}</span>`:""}</li>`).join("");html+=`<div class="day-card"><div class="day-header"><h2 class="day-title">DAY ${day.dayNumber} - ${day.title}</h2><span class="badge">${day.transportType||"行程"}</span></div><div class="meta-info">日期：${day.date} (${day.weekDay}) ｜ 住宿：${day.hotel}</div><ul>${spotsHtml}</ul></div>`});container.innerHTML=html});
</script>
</body>
</html>
