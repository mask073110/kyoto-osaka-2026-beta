-items:center;min-height:49px;border-bottom:1px solid #e9dfd3;font-size:11px}.event:last-child{border:0}.num{font:9px Georgia;color:#b59a7f}.time{font:10px Georgia;color:#71675f}.action{margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}.action h3{font:18px Georgia,"Noto Serif TC",serif;margin:4px 0}.action p,.sub{font-size:10px;color:#81766c;line-height:1.55}.buttons{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.btn{border:1px solid #d9ccbb;background:#fffaf1;border-radius:8px;padding:9px 10px;font-size:10px;color:var(--ink)}.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}.status{margin-top:9px;padding:9px;border-radius:8px;background:#efe7db;font-size:10px;line-height:1.45}.panel{padding:13px;margin:10px 0}.panel h3,.poi h3{font:16px Georgia,"Noto Serif TC",serif;margin:0 0 5px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.chip{font-size:9px;padding:4px 7px;border-radius:20px;background:#eee3d6;color:#715f51}.poi{padding:12px;margin:9px 0}.poi-head{display:flex;justify-content:space-between;gap:8px}.badge{font-size:9px;color:#54715a}.price{font:11px Georgia}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:64px;background:#fffaf6f5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:transparent;color:#766d64;font-size:10px}.nav button.active{color:var(--red)}.nav i{font-style:normal;display:block;font-size:17px;margin-bottom:2px}.utility{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.utility .panel{margin:0}.empty{padding:28px 0;text-align:center;color:var(--muted);font-size:11px}@media(min-width:431px){body{padding:16px 0}.app{border-radius:14px;overflow:hidden;box-shadow:0 5px 30px #00000012}.nav{bottom:16px}}

.candidate{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}.candidate-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.vote{border:1px solid var(--line);background:#fffaf1;border-radius:18px;padding:6px 9px;font-size:9px}.settle{padding:9px 0;border-bottom:1px solid var(--line);font-size:10px}.progress{height:7px;background:#e6dbcd;border-radius:10px;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:var(--red)}.decision{border-left:3px solid #66846d;padding-left:9px;margin:8px 0}.warn{border-left-color:#b68a48}.danger{border-left-color:#a54d43}.viewport{overflow:hidden}.page-motion{animation:fadeSlide .28s ease-out}.page-motion.back{animation:fadeBack .28s ease-out}@keyframes fadeSlide{from{opacity:.45;transform:translateX(18px)}to{opacity:1;transform:none}}@keyframes fadeBack{from{opacity:.45;transform:translateX(-18px)}to{opacity:1;transform:none}}.detail{position:fixed;z-index:35;inset:0;display:flex;justify-content:center;pointer-events:none}.detailpage{pointer-events:auto;width:min(430px,100%);height:100%;overflow:auto;background:var(--paper);padding:20px 18px 90px;animation:pushIn .28s ease-out;box-shadow:-10px 0 35px #0002}.detailpage.out{animation:pushOut .24s ease-in forwards}@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}@keyframes pushOut{to{transform:translateX(100%)}}.detailtop{display:flex;align-items:center;gap:12px;margin-bottom:18px}.backbtn{border:0;background:none;font-size:22px}.swipehint{text-align:center;font-size:8px;color:var(--muted);padding:3px 0 7px}</style></head><body><div id="app" class="app viewport"></div>
<script>
const DAYS=[
{date:"11/19",title:"台灣 → 關西 → 京都",sub:"出發・抵達京都・晚上自由活動",img:"https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1000&q=85",events:[["03:40","NOAH 新竹市出發"],["04:00","1250 客運 → 桃園機場 T1"],["05:00","T1 全員集合"],["07:40","JX820 → KIX"],["11:10","抵達 KIX"],["12:30","包車 → 京都飯店"],["15:00","飯店寄放／入住・休息"],["16:00","OPTION｜寺町・新京極・四条河原町"],["18:30","沿途晚餐"]],photo:["京都抵達紀錄","寺町・新京極街拍","四条河原町夜景"],food:["かつくら寺町店","河原町沿線晚餐候選"],near:["3COINS 京都寺町店","LE LABO Kyoto Machiya","寺町・新京極商店街"]},
{date:"11/20",title:"和服・清水寺・祇園",sub:"主要人像攝影日",img:"https://images.unsplash.com/photo-1528360983277-13d401cdc186?auto=format&fit=crop&w=1000&q=85",events:[["09:00","和服店｜3位女生著裝・髮型"],["10:00","清水寺"],["11:15","三年坂・二年坂"],["12:30","沿途午餐"],["14:00","八坂塔・高台寺方向"],["16:00","祇園・花見小路"],["17:15","歸還和服 → 河原町晚餐"]],photo:["清水寺｜和服人像","二年坂・三年坂｜街景","八坂塔｜壓縮構圖","祇園・花見小路｜黃昏"],food:["% ARABICA Higashiyama","GOKAGO","本家西尾八橋 清水店","天ぷら圓堂 八坂本店"],near:["Koto no Iroha 祇園店","AKANES 清水周邊"]},
{date:"11/21",title:"弘法市・糺之森・伏見稻荷",sub:"包車固定行程",img:"https://images.unsplash.com/photo-1478436127897-769e1b3f0f36?auto=format&fit=crop&w=1000&q=85",events:[["08:30","京都飯店出發"],["09:00","東寺 弘法市"],["11:30","下鴨神社・糺之森"],["14:30","移動伏見稻荷"],["15:00","伏見稻荷大社"],["17:30","京都站晚餐"]],photo:["東寺弘法市｜紀實","糺之森｜林間人像","伏見稻荷｜千本鳥居"],food:["ROOT2 SEIKA TOJI","出町ろろろ","祢ざめ家"],near:["弘法市攤位","伏見稻荷參道"]},
{date:"11/22",title:"勝尾寺・箕面・大阪",sub:"退房＋包車移動日",img:"https://images.unsplash.com/photo-1590559899731-a382839e5549?auto=format&fit=crop&w=1000&q=85",events:[["08:00","京都飯店退房｜行李上車"],["09:30","勝尾寺"],["11:30","箕面公園・瀑布"],["13:30","橋本亭・柚子咖啡"],["14:45","杯麵博物館 池田"],["17:00","大阪飯店入住"]],photo:["勝尾寺｜達摩與紅葉","箕面瀑布｜秋景"],food:["橋本亭・柚子咖啡","大阪飯店周邊晚餐"],near:["杯麵博物館紀念品","大阪飯店周邊採買"]},

{date:"11/24",title:"大阪 → KIX → 台灣",sub:"回程・退稅・最後採買",img:"https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=1000&q=85",events:[["08:00","飯店早餐／最後整理"],["09:30","退房・8 人行李集合"],["10:00","包車 → KIX"],["11:00","KIX｜報到・退稅／海關・最後採買"],["14:00","JX823 → TPE"],["16:15","抵達 TPE"]],photo:["回程紀錄"],food:["KIX 出境前／後餐飲"],near:["KIX 最後採買・伴手禮"]}
];
let day=Number(localStorage.getItem("kyotoDay")||0),tab=localStorage.getItem("kyotoTab")||"today",locationText="尚未定位",planMode=localStorage.getItem("planMode")||"A"; const MEMBERS=["NOAH","團員2","團員3","團員4","團員5","團員6","團員7","團員8"]; let expenses=JSON.parse(localStorage.getItem("tripExpenses")||"[]"), candidates=JSON.parse(localStorage.getItem("tripCandidates")||"[]");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function hero(d){return '<header class="hero" style="background-image:url('+d.img+')"><div class="top"><b>京都・大阪 秋旅</b><span class="beta">2026 BETA</span></div><div class="eyebrow">DAY '+(day+1)+' · '+d.date+'</div><h1>'+esc(d.title)+'</h1><p>'+esc(d.sub)+'</p></header>'}
function daybar(){return '<section class="meta"><div class="meta-row"><span>2026.11.19 — 11.24</span><b>8人攝影旅行</b></div><div class="motto">攝影決定路線，美食提供選擇。</div><div class="days">'+DAYS.map((d,i)=>'<button class="'+(i===day?'active':'')+'" onclick="setDay('+i+')"><b>'+(i+1)+'</b><span>'+d.date+'</span></button>').join("")+'</div></section>'}
function today(d){return '<main class="content"><div class="section-kicker">TODAY&#39;S ROUTE</div><h2 class="section-title">今日行程</h2><div class="note"><span>小提醒｜依現場節奏彈性調整</span><span>● '+d.events.length+' 行程</span></div><div class="modebar"><button class="'+(planMode==="A"?"active":"")+'" onclick="mode(&quot;A&quot;)">A 正常</button><button class="'+(planMode==="B"?"active":"")+'" onclick="mode(&quot;B&quot;)">B 雨天</button><button class="'+(planMode==="C"?"active":"")+'" onclick="mode(&quot;C&quot;)">C 疲累</button></div><div class="timeline">'+d.events.map((e,i)=>'<div class="event"><span class="num">'+String(i+1).padStart(2,"0")+'</span><span class="time">'+e[0]+'</span><span>'+esc(e[1])+'</span></div>').join("")+'</div><section class="action"><div class="section-kicker">RIGHT NOW</div><h3>現在去哪？</h3><p>'+nowAdvice(d)+'</p><div class="buttons"><button class="btn primary" onclick="locate()">📍 重新定位</button><button class="btn" onclick="hotel()">🏨 回飯店</button><button class="btn" onclick="rest()">☕ 附近休息</button></div><div class="status" id="locStatus">目前位置：'+esc(locationText)+'</div></section><div class="quickgrid"><button class="quick" onclick="openGroup()"><b>👥 集合模式</b><span>8 人到齊狀態</span></button><button class="quick" onclick="openExpense()"><b>💴 旅費</b><span>共同帳本・誰欠誰</span></button><button class="quick" onclick="openPrep()"><b>✈️ 出發準備</b><span>VJW・報到・eSIM</span></button><button class="quick" onclick="openSafety()"><b>🛡 安全卡</b><span>飯店・119・110</span></button><button class="quick" onclick="openCandidate()"><b>＋ 新增想去</b><span>候選池・團員投票</span></button><button class="quick" onclick="showSettlement()"><b>⇄ 誰欠誰</b><span>自動淨額結算</span></button></div>'+prepProgress()+'</main>'}
function cards(title,kicker,arr,type){let photoNotice=type==="photo"?'<div class="status">📸 攝影頁只提供拍攝指南與參考，不提供相簿、照片上傳、截圖辨識或照片管理。</div>':"";return '<main class="content"><div class="section-kicker">'+kicker+'</div><h2 class="section-title">'+title+'</h2>'+photoNotice<div class="note"><span>DAY '+(day+1)+' · '+DAYS[day].date+'</span><span>目前資料｜出發前再確認</span></div>'+arr.map((x,i)=>'<article class="poi"><div class="poi-head"><h3>'+esc(x)+'</h3><span class="badge">'+(type==="photo"?"📸 路線攝影":type==="food"?"🟢 順路候選":"📍 路線周邊")+'</span></div><div class="chips">'+(type==="photo"?'<span class="chip">推薦時段依當日路線</span><span class="chip">R8 / 45mm</span>':type==="food"?'<span class="chip">8人適性待確認</span><span class="chip">營業/LO待確認</span>':'<span class="chip">可逛可不逛</span><span class="chip">不打亂主線</span>')+'</div><div class="sub">'+(type==="photo"?"以拍攝效果為主，但不為理想光線大幅改道。":type==="food"?"價格、營業時間、LO 與 8 人座位將以出發前最新資料確認。":"依目前位置顯示距離與 ETA；不為單一店家跨區。")+'</div><div class="buttons"><button class="btn" onclick="searchMap(\''+esc(x).replace(/&#39;/g,"\\'")+'\')">導航</button>'+(type==="food"?'<button class="btn">♡ 想吃 +1</button>':type==="near"?'<button class="btn">♡ 想逛 +1</button>':'')+'</div></article>').join("")+'</main>'}
function nowAdvice(d){let h=new Date().getHours(), next=d.events.find(e=>Number(e[0].slice(0,2))>=h); if(planMode==="C")return "疲累模式：優先縮短移動，保留固定行程；可直接休息或回飯店。"; if(planMode==="B")return "雨天模式：保留固定行程，戶外點視現場天候縮短；優先室內與沿線餐飲。"; return next?"下一個排定節點："+next[0]+" "+next[1]+"。取得定位後再搭配實際移動時間判斷。":"今日固定行程已接近結束，可從沿線美食、周邊或回飯店擇一。"}
function mode(m){planMode=m;localStorage.setItem("planMode",m);render()}
function sheet(title,body){document.body.insertAdjacentHTML("beforeend",'<div class="sheet" id="sheet"><div class="sheetbox"><div class="sheethead"><h2>'+title+'</h2><button class="close" onclick="closeSheet()">×</button></div>'+body+'</div></div>')}
function closeSheet(){let x=document.getElementById("sheet");if(x)x.remove()}
function openGroup(){let key="arrived"+day,a=JSON.parse(localStorage.getItem(key)||"[]");sheet("集合模式",'<p class="sub">DAY '+(day+1)+'｜點選自己的名字切換到達狀態。</p><div class="panel">'+MEMBERS.map(n=>'<label style="display:block;padding:8px 0;border-bottom:1px solid var(--line)"><input type="checkbox" '+(a.includes(n)?"checked":"")+' onchange="toggleArrival(&quot;'+n+'&quot;,this.checked)"> '+n+'</label>').join("")+'</div>')}
function toggleArrival(n,on){let k="arrived"+day,a=JSON.parse(localStorage.getItem(k)||"[]");a=on?[...new Set([...a,n])]:a.filter(x=>x!==n);localStorage.setItem(k,JSON.stringify(a))}
function openExpense(){sheet("旅費",'<p class="sub">BETA 使用本機儲存；正式 Floot 版改為 8 人共享資料庫。</p><input id="exDesc" class="field" placeholder="項目，例如：晚餐"><input id="exAmt" class="field" inputmode="decimal" placeholder="金額 JPY"><select id="exPayer" class="field">'+MEMBERS.map(n=>'<option>'+n+'</option>').join("")+'</select><button class="btn primary" onclick="addExpense()">＋ 記一筆</button><button class="btn" onclick="closeSheet();showSettlement()">誰欠誰</button><div id="exList">'+expenseList()+'</div>')}
function expenseList(){if(!expenses.length)return '<div class="empty">尚無共同支出</div>';return expenses.map(x=>'<div class="expense"><span><b>'+esc(x.desc)+'</b><br><span class="small">付款 '+esc(x.payer)+'・8人均分</span></span><b>¥'+Number(x.amount).toLocaleString()+'</b></div>').join("")}
function addExpense(){let d=document.getElementById("exDesc").value.trim(),a=Number(document.getElementById("exAmt").value),p=document.getElementById("exPayer").value;if(!d||!a)return;expenses.push({desc:d,amount:a,payer:p,day:day});localStorage.setItem("tripExpenses",JSON.stringify(expenses));document.getElementById("exList").innerHTML=expenseList()}
function openPrep(){sheet("出發準備／辦理中心",'<p class="sub">只保存完成狀態，不保存護照號碼或付款敏感資料。</p><div class="panel">'+["旅遊保險","護照效期確認","Visit Japan Web","JX820 / JX823 線上報到","座位確認","行李規則","eSIM / 漫遊","台灣 e-Gate"].map((x,i)=>'<label style="display:block;padding:8px 0;border-bottom:1px solid var(--line)"><input type="checkbox" onchange="prep('+i+',this.checked)" '+(JSON.parse(localStorage.getItem("prep")||"[]").includes(i)?"checked":"")+'> '+x+'</label>').join("")+'</div>')}
function prep(i,on){let a=JSON.parse(localStorage.getItem("prep")||"[]");a=on?[...new Set([...a,i])]:a.filter(x=>x!==i);localStorage.setItem("prep",JSON.stringify(a))}
function openSafety(){sheet("旅行安全卡",'<div class="panel"><h3>緊急電話</h3><p>日本警察 110<br>救護／消防 119</p></div><div class="panel"><h3>京都住宿</h3><p class="sub">Comfort Hotel Kyoto Horikawagojo<br>134-32 Sensui-cho, Shimogyo-ku, Kyoto</p></div><div class="panel"><h3>大阪住宿</h3><p class="sub">Hearton Hotel Shinsaibashi Nagahoridori<br>1-5-11 Shinmachi, Nishi-ku, Osaka</p></div>')}
function openCandidate(){sheet("＋新增想去",'<p class="sub">只收 Google Maps 連結或店家／景點名稱，不收截圖。新增後依 DAY1–DAY6 路線分類進候選池，不使用 AI，也不會自動改官方行程。</p><input id="candName" class="field" placeholder="店家／景點名稱"><input id="candLink" class="field" placeholder="Google Maps 連結（選填）"><select id="candType" class="field"><option value="food">🍴 想吃</option><option value="near">🛍 想逛</option><option value="spot">📍 想去</option></select><button class="btn primary" onclick="addCandidate()">加入候選</button><div class="candidate">'+candidateList()+'</div>')}
function addCandidate(){let n=document.getElementById("candName").value.trim(),l=document.getElementById("candLink").value.trim(),t=document.getElementById("candType").value;if(!n)return;candidates.push({id:Date.now(),name:n,link:l,type:t,day:day,votes:1});localStorage.setItem("tripCandidates",JSON.stringify(candidates));closeSheet();openCandidate()}
function candidateList(){let a=candidates.filter(x=>x.day===day);if(!a.length)return '<div class="empty">本日尚無團員候選</div>';return a.map(x=>'<div class="candidate-row"><span><b>'+esc(x.name)+'</b><br><span class="small">DAY '+(x.day+1)+' 候選・不自動改行程</span></span><button class="vote" onclick="voteCandidate('+x.id+')">♡ '+x.votes+'</button></div>').join("")}
function voteCandidate(id){let x=candidates.find(x=>x.id===id);if(x)x.votes++;localStorage.setItem("tripCandidates",JSON.stringify(candidates));closeSheet();openCandidate()}
function settlement(){if(!expenses.length)return '<div class="empty">尚無可結算支出</div>';let bal={};MEMBERS.forEach(m=>bal[m]=0);expenses.forEach(x=>{let share=Number(x.amount)/MEMBERS.length;MEMBERS.forEach(m=>bal[m]-=share);bal[x.payer]+=Number(x.amount)});let debt=MEMBERS.filter(m=>bal[m]<-0.5).map(m=>[m,-bal[m]]),cred=MEMBERS.filter(m=>bal[m]>0.5).map(m=>[m,bal[m]]),res=[];let i=0,j=0;while(i<debt.length&&j<cred.length){let v=Math.min(debt[i][1],cred[j][1]);res.push(debt[i][0]+' → '+cred[j][0]+' ¥'+Math.round(v).toLocaleString());debt[i][1]-=v;cred[j][1]-=v;if(debt[i][1]<.5)i++;if(cred[j][1]<.5)j++}return res.map(x=>'<div class="settle">'+x+'</div>').join("")}
function showSettlement(){sheet("誰欠誰",'<p class="sub">目前 BETA 以每筆 8 人均分計算；正式版加入 2–8 人實際參與者與自訂分攤。</p>'+settlement())}
function prepProgress(){let a=JSON.parse(localStorage.getItem("prep")||"[]"),pct=Math.round(a.length/8*100);return '<div class="status">出發準備 '+a.length+'/8<div class="progress"><span style="width:'+pct+'%"></span></div></div>'}
function nav(){return '<nav class="nav">'+[["today","⌾","今日"],["photo","▣","攝影"],["food","♜","美食"],["near","▤","周邊"]].map(x=>'<button class="'+(tab===x[0]?'active':'')+'" onclick="setTab(\''+x[0]+'\')"><i>'+x[1]+'</i>'+x[2]+'</button>').join("")+'</nav>'}
function render(dir){let d=DAYS[day],body=tab==="today"?today(d):tab==="photo"?cards("攝影指南","PHOTO ROUTE",d.photo,"photo"):tab==="food"?cards("沿途美食","FOOD OPTIONS",d.food,"food"):cards("路線周邊","NEARBY",d.near,"near");document.getElementById("app").innerHTML='<div class="page-motion '+(dir==="back"?"back":"")+'">'+hero(d)+daybar()+'<div class="swipehint">行程內容左右滑可切換 DAY</div>'+body+'</div>'+nav();bindSwipe()}
function setDay(i){if(i<0||i>=DAYS.length||i===day)return;let dir=i>day?"next":"back";day=i;localStorage.setItem("kyotoDay",i);render(dir);scrollTo({top:0,behavior:"smooth"})}function setTab(t){if(t===tab)return;tab=t;localStorage.setItem("kyotoTab",t);render("next");scrollTo({top:0,behavior:"smooth"})}
function locate(){let s=document.getElementById("locStatus");if(!navigator.geolocation){locationText="此瀏覽器不支援定位";render();return}s.textContent="正在取得位置…";navigator.geolocation.getCurrentPosition(p=>{locationText="定位成功｜"+p.coords.latitude.toFixed(4)+", "+p.coords.longitude.toFixed(4);render()},()=>{locationText="定位未授權／取得失敗，可稍後重新定位";render()},{enableHighAccuracy:true,timeout:10000,maximumAge:0})}
function hotel(){let q=day<3?"Comfort Hotel Kyoto Horikawagojo":"Hearton Hotel Shinsaibashi Nagahoridori";window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),"_blank")}
function rest(){window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("cafe convenience store toilet"),"_blank")}
function searchMap(q){window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),"_blank")}
let sx=0,sy=0,st=0;function bindSwipe(){let a=document.querySelector(".page-motion");if(!a)return;a.addEventListener("touchstart",e=>{if(e.target.closest("button,input,select,.days"))return;let t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});a.addEventListener("touchend",e=>{if(!sx)return;let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,d=Date.now()-st;sx=0;if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.35||d>700)return;if(dx<0&&day<5)setDay(day+1);if(dx>0&&day>0)setDay(day-1)},{passive:true})}
function openDetail(title,type){let d=document.createElement("div");d.className="detail";d.id="detail";d.innerHTML='<section class="detailpage"><div class="detailtop"><button class="backbtn" onclick="closeDetail()">‹</button><div><div class="section-kicker">'+type+'</div><h2 class="section-title">'+esc(title)+'</h2></div></div><div class="panel"><h3>DAY '+(day+1)+' 路線資訊</h3><p class="sub">此項目以今日主線為優先。即時距離、營業時間與 ETA 若尚未取得，維持待確認，不產生假資料。</p><div class="buttons"><button class="btn primary" onclick="searchMap(\''+esc(title).replace(/&#39;/g,"\\'")+'\')">Google Maps 導航</button></div></div></section>';document.body.appendChild(d)}function closeDetail(){let d=document.querySelector(".detailpage");if(!d)return;d.classList.add("out");setTimeout(()=>document.getElementById("detail")?.remove(),240)}
render();
</script><div style="display:none" id="architecturePolicy">核心旅行功能不依賴 AI 或 LLM；AI/build credits 為 0 時仍可運作。取消 AI Chat、浮動 AI 按鈕、截圖上傳、OCR、照片相簿、Google Photos、旅程照片上傳與刪除管理。Hero 僅為每日固定目的地視覺；攝影頁僅為拍攝指南。</div></body></html>
