function poiCard(x,type){let meta=type==="photo"?PHOTO_META[x]:type==="food"?FOOD_META[x]:null, chips="",desc="";if(type==="photo"){meta=meta||["依當日路線","R8 / 24–50mm","依現場光線調整","20–30分"];chips='<span class="chip">⏱ '+meta[0]+'</span><span class="chip">📷 '+meta[1]+'</span><span class="chip">停留 '+meta[3]+'</span>';desc=meta[2]+'。拍攝效果優先，但不為理想光線大幅改道。'}else if(type==="food"){meta=meta||["正餐／候選","45–60分","👥 8人適性待確認"];chips='<span class="chip">'+meta[0]+'</span><span class="chip">⏱ '+meta[1]+'</span><span class="chip">'+meta[2]+'</span>';desc='價格、營業時間與 LO 於出發前依最新資料確認；現場以不影響主行程為原則。'}else{chips='<span class="chip">🟢/🟡 路線周邊</span><span class="chip">可逛可不逛</span>';desc='依目前位置確認距離與 ETA；不為單一店家跨區。'}return '<article class="poi"><div class="poi-head"><h3>'+esc(x)+'</h3><span class="badge">'+(type==="photo"?"📸 攝影指南":type==="food"?"🍴 順路候選":"📍 路線周邊")+'</span></div><div class="chips">'+chips+'</div><div class="sub">'+desc+'</div><div class="buttons"><button class="btn" onclick="openDetail(&quot;'+esc(x)+'&quot;,&quot;'+type+'&quot;)">查看詳細</button><button class="btn" onclick="searchMap(&quot;'+esc(x)+'&quot;)">導航</button></div></article>'}
function openExpense(){sheet("旅費",'<p class="sub">選擇實際參與者 2–8 人；目前支援均分，並保留每筆來源供結算追溯。</p><input id="exDesc" class="field" placeholder="項目，例如：晚餐"><input id="exAmt" class="field" inputmode="decimal" placeholder="金額"><select id="exCurrency" class="field"><option>JPY</option><option>TWD</option></select><select id="exPayer" class="field">'+MEMBERS.map(n=>'<option>'+n+'</option>').join("")+'</select><div class="small">實際參與者</div><div class="checkgrid">'+MEMBERS.map((n,i)=>'<label><input class="exMember" type="checkbox" value="'+n+'" checked> '+n+'</label>').join("")+'</div><button class="btn primary" onclick="addExpense()">＋ 記一筆</button><button class="btn" onclick="closeSheet();showSettlement()">誰欠誰</button><div id="exList">'+expenseList()+'</div>')}
function expenseList(){if(!expenses.length)return '<div class="empty">尚無共同支出</div>';return expenses.map(x=>'<div class="expense"><span><b>'+esc(x.desc)+'</b><br><span class="small">DAY '+(Number(x.day)+1)+'・付款 '+esc(x.payer)+'・'+(x.members||MEMBERS).length+'人均分</span></span><b>'+(x.currency==="TWD"?"NT$":"¥")+Number(x.amount).toLocaleString()+'</b></div>').join("")}
function addExpense(){let d=document.getElementById("exDesc").value.trim(),a=Number(document.getElementById("exAmt").value),p=document.getElementById("exPayer").value,c=document.getElementById("exCurrency").value,m=[...document.querySelectorAll(".exMember:checked")].map(x=>x.value);if(!d||!a||m.length<2)return alert("請輸入項目、金額，並至少選 2 位參與者");expenses.push({id:Date.now(),desc:d,amount:a,payer:p,currency:c,day:day,members:m});localStorage.setItem("tripExpenses",JSON.stringify(expenses));document.getElementById("exList").innerHTML=expenseList()}
function openPrep(){sheet("出發準備／辦理中心",'<p class="sub">只保存完成狀態，不保存護照號碼或付款敏感資料。</p><div class="panel">'+["旅遊保險","護照效期確認","Visit Japan Web","JX820 / JX823 線上報到","座位確認","行李規則","eSIM / 漫遊","台灣 e-Gate"].map((x,i)=>'<label style="display:block;padding:8px 0;border-bottom:1px solid var(--line)"><input type="checkbox" onchange="prep('+i+',this.checked)" '+(JSON.parse(localStorage.getItem("prep")||"[]").includes(i)?"checked":"")+'> '+x+'</label>').join("")+'</div>')}
function prep(i,on){let a=JSON.parse(localStorage.getItem("prep")||"[]");a=on?[...new Set([...a,i])]:a.filter(x=>x!==i);localStorage.setItem("prep",JSON.stringify(a))}
function openSafety(){sheet("旅行安全卡",'<div class="panel"><h3>緊急電話</h3><p>日本警察 110<br>救護／消防 119</p></div><div class="panel"><h3>京都住宿</h3><p class="sub">Comfort Hotel Kyoto Horikawagojo<br>134-32 Sensui-cho, Shimogyo-ku, Kyoto</p></div><div class="panel"><h3>大阪住宿</h3><p class="sub">Hearton Hotel Shinsaibashi Nagahoridori<br>1-5-11 Shinmachi, Nishi-ku, Osaka</p></div>')}
function openCandidate(){sheet("＋新增想去",'<p class="sub">只收 Google Maps 連結或店家／景點名稱，不收截圖。新增後依 DAY1–DAY6 路線分類進候選池，不使用 AI，也不會自動改官方行程。</p><input id="candName" class="field" placeholder="店家／景點名稱"><input id="candLink" class="field" placeholder="Google Maps 連結（選填）"><select id="candType" class="field"><option value="food">🍴 想吃</option><option value="near">🛍 想逛</option><option value="spot">📍 想去</option></select><button class="btn primary" onclick="addCandidate()">加入候選</button><div class="candidate">'+candidateList()+'</div>')}
function addCandidate(){let n=document.getElementById("candName").value.trim(),l=document.getElementById("candLink").value.trim(),t=document.getElementById("candType").value;if(!n)return;let suggested=day,reason="依目前正在查看的 DAY 先放入候選；正式版解析地點後再比較 DAY1–DAY6 路線。";candidates.push({id:Date.now(),name:n,link:l,type:t,day:suggested,votes:1,reason:reason});localStorage.setItem("tripCandidates",JSON.stringify(candidates));closeSheet();openCandidate()}
function candidateList(){let a=candidates.filter(x=>x.day===day);if(!a.length)return '<div class="empty">本日尚無團員候選</div>';return a.map(x=>'<div class="candidate-row"><span><b>'+esc(x.name)+'</b><br><span class="small">DAY '+(x.day+1)+' 候選・不自動改行程</span><div class="routefit">🟡 '+esc(x.reason||"路線適性待確認")+'</div></span><button class="vote" onclick="voteCandidate('+x.id+')">♡ '+x.votes+'</button></div>').join("")}
function voteCandidate(id){let x=candidates.find(x=>x.id===id);if(x)x.votes++;localStorage.setItem("tripCandidates",JSON.stringify(candidates));closeSheet();openCandidate()}
function settlement(){if(!expenses.length)return '<div class="empty">尚無可結算支出</div>';return ["JPY","TWD"].map(cur=>{let es=expenses.filter(x=>(x.currency||"JPY")===cur);if(!es.length)return "";let bal={};MEMBERS.forEach(m=>bal[m]=0);es.forEach(x=>{let ms=x.members||MEMBERS,share=Number(x.amount)/ms.length;ms.forEach(m=>bal[m]-=share);bal[x.payer]+=Number(x.amount)});let debt=MEMBERS.filter(m=>bal[m]<-0.5).map(m=>[m,-bal[m]]),cred=MEMBERS.filter(m=>bal[m]>0.5).map(m=>[m,bal[m]]),res=[],i=0,j=0;while(i<debt.length&&j<cred.length){let v=Math.min(debt[i][1],cred[j][1]);res.push(debt[i][0]+' → '+cred[j][0]+' '+(cur==="TWD"?"NT$":"¥")+Math.round(v).toLocaleString());debt[i][1]-=v;cred[j][1]-=v;if(debt[i][1]<.5)i++;if(cred[j][1]<.5)j++}return '<h3>'+cur+'</h3>'+res.map(x=>'<div class="settle">'+x+'</div>').join("")}).join("")}
function showSettlement(){sheet("誰欠誰",'<p class="sub">依每筆實際參與者計算淨額；JPY / TWD 分開結算，不混用匯率。</p>'+settlement()+'<div class="panel"><h3>來源明細</h3>'+expenseList()+'</div>')}
function nav(){return '<nav class="nav">'+[["today","⌾","今日"],["photo","▣","攝影"],["food","♜","美食"],["near","▤","周邊"]].map(x=>'<button class="'+(tab===x[0]?'active':'')+'" onclick="setTab(\''+x[0]+'\')"><i>'+x[1]+'</i>'+x[2]+'</button>').join("")+'</nav>'}
function render(dir){let d=DAYS[day],body=tab==="today"?today(d):tab==="photo"?cards("攝影指南","PHOTO ROUTE",d.photo,"photo"):tab==="food"?cards("沿途美食","FOOD OPTIONS",d.food,"food"):cards("路線周邊","NEARBY",d.near,"near");document.getElementById("app").innerHTML='<div class="page-motion '+(dir==="back"?"back":"")+'">'+hero(d)+daybar()+'<div class="swipehint">行程內容左右滑可切換 DAY</div>'+body+'</div>'+nav();bindSwipe()}
function setDay(i){if(i<0||i>=DAYS.length||i===day)return;let dir=i>day?"next":"back";day=i;localStorage.setItem("kyotoDay",i);render(dir);scrollTo({top:0,behavior:"smooth"})}function setTab(t){if(t===tab)return;tab=t;localStorage.setItem("kyotoTab",t);render("next");scrollTo({top:0,behavior:"smooth"})}
function locate(){let s=document.getElementById("locStatus");if(!navigator.geolocation){locationText="此瀏覽器不支援定位";render();return}s.textContent="正在取得位置…";navigator.geolocation.getCurrentPosition(p=>{locationText="定位成功｜"+p.coords.latitude.toFixed(4)+", "+p.coords.longitude.toFixed(4);render()},()=>{locationText="定位未授權／取得失敗，可稍後重新定位";render()},{enableHighAccuracy:true,timeout:10000,maximumAge:0})}
function hotel(){let q=day<3?"Comfort Hotel Kyoto Horikawagojo":"Hearton Hotel Shinsaibashi Nagahoridori";window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),"_blank")}
function rest(){window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("cafe convenience store toilet"),"_blank")}
function searchMap(q){window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),"_blank")}
let sx=0,sy=0,st=0;function bindSwipe(){let a=document.querySelector(".page-motion");if(!a)return;a.addEventListener("touchstart",e=>{if(e.target.closest("button,input,select,.days"))return;let t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});a.addEventListener("touchend",e=>{if(!sx)return;let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,d=Date.now()-st;sx=0;if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.35||d>700)return;if(dx<0&&day<5)setDay(day+1);if(dx>0&&day>0)setDay(day-1)},{passive:true})}
function openDetail(title,type){let d=document.createElement("div");d.className="detail";d.id="detail";d.innerHTML='<section class="detailpage"><div class="detailtop"><button class="backbtn" onclick="closeDetail()">‹</button><div><div class="section-kicker">'+type+'</div><h2 class="section-title">'+esc(title)+'</h2></div></div><div class="panel"><h3>DAY '+(day+1)+' 路線資訊</h3><p class="sub">此項目以今日主線為優先。即時距離、營業時間與 ETA 若尚未取得，維持待確認，不產生假資料。</p><div class="buttons"><button class="btn primary" onclick="searchMap(\''+esc(title).replace(/&#39;/g,"\\'")+'\')">Google Maps 導航</button></div></div></section>';document.body.appendChild(d)}function closeDetail(){let d=document.querySelector(".detailpage");if(!d)return;d.classList.add("out");setTimeout(()=>document.getElementById("detail")?.remove(),240)}
render();

function mins(t){let a=t.split(":").map(Number);return a[0]*60+a[1]}
function nowState(d){let n=new Date(),cur=n.getHours()*60+n.getMinutes(),future=d.events.find(e=>mins(e[0])>=cur),free=future?mins(future[0])-cur:null;return {future,free}}
function nowAdvice(d){let x=nowState(d);if(planMode==="C")return "疲累模式：優先縮短移動，保留固定行程；可直接休息或回飯店。";if(planMode==="B")return "雨天模式：保留固定行程，戶外點視現場天候縮短；優先室內與沿線餐飲。";if(!x.future)return "今日固定行程已接近結束，可從沿線美食、周邊或回飯店擇一。";let f=x.free;return (f>=90?"🟢 時間較充裕":f>=45?"🟡 有一段彈性時間":"🔴 接近下一個固定節點")+"｜下一個："+x.future[0]+" "+x.future[1]+"。"+(locationText==="尚未定位"?" 尚未取得位置，因此不顯示假 ETA。":" 已取得裝置定位，請以 Google Maps 即時 ETA 為準。")}
function freeTime(d){let x=nowState(d);return x.free===null?"今天已無下一個固定節點":x.free<=0?"下一個固定節點已到時間":"距下一個固定節點約 "+Math.floor(x.free/60)+" 小時 "+x.free%60+" 分"}
</script><div style="display:none" id="architecturePolicy">核心旅行功能不依賴 AI 或 LLM；AI/build credits 為 0 時仍可運作。取消 AI Chat、浮動 AI 按鈕、截圖上傳、OCR、照片相簿、Google Photos、旅程照片上傳與刪除管理。Hero 僅為每日固定目的地視覺；攝影頁僅為拍攝指南。</div></body></html>
