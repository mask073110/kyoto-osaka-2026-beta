name: Cache verified travel images
on:
  push:
    branches: [main]
    paths: [.github/workflows/cache-images.yml]
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified hotel entrance photos
        run: |
          mkdir -p assets/hotels
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://dynamic-media-cdn.tripadvisor.com/media/photo-o/1c/ce/45/67/caption.jpg?w=1200&h=-1&s=1" -o assets/hotels/kyoto-comfort-era.jpg
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://www.hearton.co.jp/en/assets/images/nagahori/top_img06.jpg" -o assets/hotels/osaka-hearton-nagahori.jpg
          test $(stat -c%s assets/hotels/kyoto-comfort-era.jpg) -gt 10000
          test $(stat -c%s assets/hotels/osaka-hearton-nagahori.jpg) -gt 10000
      - name: Commit cached images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hotels
          git diff --cached --quiet || git commit -m "Replace hotel photos with verified entrance images"
          git push
